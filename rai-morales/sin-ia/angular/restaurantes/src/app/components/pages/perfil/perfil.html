<div id = "datos-usuario">
       <div id = "foto">
            <img id = "foto-usuario" src= "{{ usuario.foto }}" alt="Foto de perfil">
            <form id = "imagen-avatar" enctype="multipart/form-data">

                <label for="avatar">Cambiar foto de perfil:</label><br>
                <input type="file" id="avatar" name="avatar" accept="image/*"><br><br>
                <button type="submit">Subir nueva foto</button>
            </form>
       </div> 
       <div id = "texto-usuario">
            <strong>
                
                Usuario:
            </strong>
            {{ usuario.usuario }}
        </div>
    <button id = "logout">Cerrar sesión</button>
</div>
