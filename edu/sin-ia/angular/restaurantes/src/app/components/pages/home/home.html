<h1>Nuestros Restaurantes</h1>

<div class="listado-restaurantes">
  @for (restaurante of restaurantes; track restaurante.id) {
    <app-restaurante-card 
      [id]="restaurante.id" 
      [nombre]="restaurante.nombre"
      [descripcion]="restaurante.descripcion" 
      [fotografia_url]="restaurante.fotografia_url"
      [lat]="restaurante.latitud"
      [lng]="restaurante.longitud"
    ></app-restaurante-card>
  }
</div>
