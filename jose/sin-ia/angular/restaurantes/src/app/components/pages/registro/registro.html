<!--
  Plantilla Angular para el registro de usuario
  Senior Cat recomienda NO incluir <html>, <head> ni <body> en los templates de componentes.
-->
<div class="login-container">
  <h2>Registro</h2>
  <form (ngSubmit)="onRegister()">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" placeholder="Nombre de usuario" required [(ngModel)]="nombre"/>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="Contraseña" required [(ngModel)]="password"/>
    </div>
    <button type="submit">Registrarse</button>
    <div class="login-message">{{message}}</div>
  </form>
</div>
