<!--
    Formulario de Login
    
-->
<div class="login-container">
    <h2>Iniciar sesión</h2>
    <form (ngSubmit)="onLogin()">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" placeholder="usuario@ejemplo.com" required [(ngModel)]="email"/>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="Contraseña" required [(ngModel)]="password"/>
        </div>
        <button type="submit">Entrar</button>
        <div class="login-message">{{message}}</div>
    </form>
</div>
