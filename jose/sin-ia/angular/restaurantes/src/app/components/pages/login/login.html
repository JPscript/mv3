<!--
  Formulario de Login
  Este archivo define la estructura visual para que el usuario pueda iniciar sesión.
  Cada sección está comentada para explicar su propósito.
-->
<div class="login-container">
    <!-- Título del formulario -->
    <h2>Iniciar sesión</h2>
    <!-- Formulario que ejecuta onLogin() al enviarse -->
    <form (ngSubmit)="onLogin()">
        <!-- Campo para el nombre de usuario -->
        <div class="form-group">
            <label for="nombre">Nombre de usuario</label>
            <!-- [(ngModel)] enlaza el valor del input con la variable 'nombre' del componente -->
            <input id="nombre" name="nombre" type="text" placeholder="Nombre de usuario" required [(ngModel)]="nombre"/>
        </div>
        <!-- Campo para la contraseña -->
        <div class="form-group">
            <label for="password">Contraseña</label>
            <!-- [(ngModel)] enlaza el valor del input con la variable 'password' del componente -->
            <input id="password" name="password" type="password" placeholder="Contraseña" required [(ngModel)]="password"/>
        </div>
        <!-- Botón para enviar el formulario -->
        <button type="submit">Entrar</button>
        <!-- Mensaje para mostrar errores o éxito al usuario -->
        <div class="login-message">{{message}}</div>
    </form>
</div>
