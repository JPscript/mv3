<!--
    Componente visual para mostrar la información de un restaurante.
    Senior Cat dice: Cada tarjeta es un ladrillo visual que muestra los datos recibidos.
    Al hacer click, se avisa al padre para navegar al detalle.
-->
<div class="card" (click)="onCardClick()">
    <!-- Imagen principal del restaurante. El atributo [src] enlaza dinámicamente la URL recibida como input. -->
    <img [src]="imagen" class="card-img-top" alt="Imagen del restaurante">
    <!-- Título con el nombre del restaurante. Se muestra usando la función nombre() para obtener el valor reactivo. -->
    <h2 class="card-title">{{ nombre() }}</h2>
    <!-- Descripción breve del restaurante. También se obtiene de forma reactiva. -->
    <p class="card-descripcion">{{ descripcion() }}</p>
</div>
