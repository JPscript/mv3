<div class="restaurant-card">
    <div class="card-header">
        <h2 class="name">{{ name() }}</h2>
        <p class="description">{{ description() }}</p>
    </div>
    <div class="card-content">
        <img class="image" ngSrc="{{ picture() }}" alt="A super restaurant" width="400" height="200" priority>
        <div class="coordo">
            <p>{{ lat() }}</p>
            <p>{{ lng() }}</p>
        </div>
        <div class="rating">
<div class="rating">
    <!-- <span>{{ (rating() ?? 0) - 1 }}</span> -->
    @for (star of [1,2,3,4,5]; track star) {
      <span>{{ star <= (rating() ?? 0) ? '★' : '☆' }}</span>
    }
  </div>
        </div>
    </div>
</div>
