<section>
    <h1>Profile</h1>
    @if (errorMessage) {
        <p>{{ errorMessage }}</p>
    }

    @if (currentUser()) {
        <p><strong>Id:</strong> {{ currentUser()?.id }}</p>
        <p><strong>Name:</strong> {{ currentUser()?.nombre }}</p>
        <p><strong>Image:</strong> {{ currentUser()?.image_url || 'No image yet' }}</p>
        <button (click)="logout()">Logout</button>
    } @else {
        <p>Loading profile...</p>
    }
