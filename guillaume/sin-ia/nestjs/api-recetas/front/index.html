<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 ws:; img-src 'self' data: http://localhost:3000 http://127.0.0.1:3000;">
    <link rel="stylesheet" href="style.css">
    <title>API Recetas</title>
</head>
<body data-page="recipes">
    <h1>Recetas maravilosas !</h1>
    <div class="recipes-container"></div>
    <a href="new-recipe.html" class="btn">Añadir una receta</a>
    <div id="recipe-update-box" class="recipe-update-box">
        <button id="close-update-box" type="button" style="float:right;font-size:1.5rem;background:none;border:none;color:var(--text-primary);cursor:pointer">&times;</button>
        <form action="update" id="update-recipe-form">
            <input type="text" name="nombre">
            <input type="text" name="descripcion">
            <input type="text" name="ingredientes">
            <label for="tiempo_min">Tiempo minimo</label>
            <input type="number" name="tiempo_min">
            <select name="dificultad" id="dificultad">
                <option value="facil">facil</option>
                <option value="media">media</option>
                <option value="dificil">dificil</option>
            </select>
            <input type="file" name="picture" accept="image/*" id="picture">
            <input class="btn" type="submit" value="Enviar">
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
