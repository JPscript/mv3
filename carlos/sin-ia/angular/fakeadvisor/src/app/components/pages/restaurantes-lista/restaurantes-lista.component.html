<h2>Restaurantes</h2>

<ul class="lista-restaurantes">
  <li *ngFor="let r of restaurantesOrdenados">
    <a
  class="nombre"
  [href]="'https://www.google.com/maps/search/?api=1&query=' + encode(r.direccion)"
  target="_blank"
>
  {{ r.nombre }}
</a>
<span class="puntuacion">⭐ {{ r.puntuacion }}</span>

  </li>
</ul>
