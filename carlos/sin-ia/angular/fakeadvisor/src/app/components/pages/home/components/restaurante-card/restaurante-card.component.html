  <div class="card">
    <img [src]="restaurante.imagen" alt="{{ restaurante.nombre }}" />
  
    <h2>{{ restaurante.nombre }}</h2>
  
    <p>
      <a 
        [href]="'https://www.google.com/maps/search/?api=1&query=' + restaurante.direccion"
        target="_blank"
      >
        {{ restaurante.direccion }}
      </a>
    </p>
  
    <p>Puntuación: {{ restaurante.puntuacion }}</p>
  </div>
