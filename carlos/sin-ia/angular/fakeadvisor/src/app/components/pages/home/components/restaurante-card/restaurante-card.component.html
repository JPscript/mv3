<div class="card" [routerLink]="['/restaurante', restaurante.id]">

  <img [src]="restaurante.imagen" [alt]="restaurante.nombre" />

  <h2>{{ restaurante.nombre }}</h2>

  <p class="direccion">
    📍 {{ restaurante.direccion }}
  </p>

  <p class="puntuacion">
    ⭐ {{ restaurante.puntuacion }}
  </p>

</div>
