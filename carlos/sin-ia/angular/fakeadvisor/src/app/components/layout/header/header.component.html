<header class="header">
  <a class="logo" routerLink="/">
    <img src="assets/logo.png" alt="FakeAdvisor Logo" />
  </a>
  
  
    <div class="search-container">
      <input 
        type="text" 
        placeholder="Buscar restaurante..."
        [(ngModel)]="searchText"
        (input)="buscar()"
      />
  
      <ul class="suggestions" *ngIf="sugerencias.length > 0">
        <li 
          *ngFor="let item of sugerencias"
          (click)="abrirEnMaps(item)"
        >
          {{ item.nombre }}
        </li>
      </ul>
    </div>
  
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active">Inicio</a>
      <a routerLink="/restaurantes" routerLinkActive="active">Restaurantes</a>
      <a routerLink="/mapa" routerLinkActive="active">Mapa</a>
      <a routerLink="/perfil" routerLinkActive="active">Perfil</a>
    </nav>
  </header>
