<section class="container">
  <h1>Explora Restaurantes</h1>
  <p>Mostrando {{ restaurantes().length }} sitios disponibles</p>

  <div class="restaurantes-grid">
    @for (res of restaurantes(); track res.id) {
      <div class="res-card" [routerLink]="['/restaurantes', res.id]">
        <div class="img-container">
          <img [src]="res.fotografia_url" [alt]="res.nombre" />
        </div>
        <div class="res-info">
          <h3>{{ res.nombre }}</h3>
          <p>{{ res.descripcion }}</p>
          @if (res.rating_summary) {
            <p>⭐ {{ res.rating_summary.average }} ({{ res.rating_summary.count }} valoraciones)</p>
          }
        </div>
      </div>
    }
  </div>
</section>
