<section>
	<h1>Registro</h1>

	<form (ngSubmit)="submitRegister()">
		<label for="nombre">Nombre</label>
		<input id="nombre" name="nombre" [(ngModel)]="nombre" required>

		<label for="password">Contraseña</label>
		<input id="password" name="password" type="password" [(ngModel)]="password" required>

		<label for="confirmPassword">Repetir contraseña</label>
		<input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required>

		@if (errorMessage) {
			<p>{{ errorMessage }}</p>
		}

		<button type="submit" [disabled]="isSubmitting">
			@if (isSubmitting) {
				Registrando...
			} @else {
				Crear cuenta
			}
		</button>
	</form>

	<p>¿Ya tienes cuenta? <a routerLink="/login">Ir al login</a></p>
</section>
