<section>
	<h1>Borrar restaurante</h1>

	@if (errorMessage) {
		<p>{{ errorMessage }}</p>
	}

	@if (restaurante) {
		<p>Vas a borrar <strong>{{ restaurante.nombre }}</strong>.</p>
		<p>Esta acción no se puede deshacer.</p>

		<button type="button" (click)="confirmDelete()" [disabled]="isDeleting">
			@if (isDeleting) {
				Borrando restaurante...
			} @else {
				Confirmar borrado
			}
		</button>
	}

	<p><a routerLink="/restaurantes">Cancelar y volver</a></p>
</section>
