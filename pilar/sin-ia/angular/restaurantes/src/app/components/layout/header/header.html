<header class="main-header">
    <nav class="nav-container" aria-label="Menú principal">

        <!-- 1. Menú Hamburguesa -->
        <button class="boton-menu" aria-label="Menú">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
            </svg>
        </button>

        <!-- 2. Logo -->
        <div class="logo-container">
            <a class="logo" routerLink="/recetas" aria-label="recetalia">
                <img class="header-logo" src="\recetalia.svg" alt="Recetalia" />
            </a>
        </div>

        <!-- 3. Buscador -->
        <form action="/buscar" method="get" class="search-form" role="search">
            <div class="search-wrapper">
                <input type="search" name="q" placeholder="Buscar restaurante" aria-label="Buscar">
                <button type="submit" class="search-btn">
                    <!-- Icono de lupa simple -->
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path
                            d="M10 4a6 6 0 100 12 6 6 0 000-12zm-8 6a8 8 0 1114.32 4.906l5.387 5.387-1.414 1.414-5.387-5.387A8 8 0 012 10z">
                        </path>
                    </svg>
                </button>
            </div>
        </form>

        <!--4. Icono del Mundo  -->
        <div class="world-icon">
            <a routerLink="/mapa" class="boton-icono" title="Ver Mapa">
                <img src="map.svg" alt="Mapa" width="24" height="24">
            </a>
        </div>


        <!-- 5. Usuario -->
        <div class="user-menu">
            <a routerLink="/login" class="user-link" aria-label="Iniciar sesión">
                <img src="/user.svg" alt="Usuario" width="24" height="24">
            </a>
        </div>

    </nav>
</header>
