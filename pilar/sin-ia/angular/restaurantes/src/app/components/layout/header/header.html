<header class="main-header">
    <nav class="nav-container" aria-label="Menú principal">

        <!-- Logo -->
        <div class="logo-container">
            <a class="logo" [routerLink]="['/restaurantes']">
                <img class="header-logo" src="recetalia.svg" alt="Recetalia" />
            </a>
        </div>

        <!-- Buscador -->
        <form class="search-form" (submit)="$event.preventDefault()"> 
            <div class="search-wrapper">
                <input type="search" name="q" placeholder="Buscar..." aria-label="Buscar">
                <button type="submit" class="search-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M10 4a6 6 0 100 12 6 6 0 000-12zm-8 6a8 8 0 1114.32 4.906l5.387 5.387-1.414 1.414-5.387-5.387A8 8 0 012 10z"></path>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Icono del Mapa -->
        <div class="world-icon">
            <a [routerLink]="['/mapa']" class="boton-icono" title="Ver Mapa">
                <img src="map.svg" alt="Mapa" width="24" height="24">
            </a>
        </div>

        <!-- Usuario -->
        <div class="user-menu">
            @if (isLoggedIn()) {

                <!-- Usuario logueado -->
                <div class="user-menu-container">
                    <button (click)="toggleMenu()" class="user-link" aria-label="Menú de usuario" type="button">
                        <img src="user.svg" alt="Usuario" width="24" height="24">
                    </button>

                    <!-- Desplegable -->
                    @if (isMenuOpen()) {
                        <div class="user-dropdown">
                            <div class="user-info">
                                <p>{{ currentUser()?.nombre }}</p>
                            </div>
                            <a [routerLink]="['/perfil']" (click)="closeMenu()" class="dropdown-link">Mi perfil</a>
                            <button (click)="logout()" class="logout-btn">
                                Cerrar sesión
                            </button>
                        </div>
                    }
                </div>

            } @else {

                <!-- Usuario no logueado -->
                <a [routerLink]="['/login']" class="user-link" aria-label="Iniciar sesión">
                    <img src="user.svg" alt="Login" width="24" height="24">
                </a>

            }
        </div>

    </nav>
</header>
