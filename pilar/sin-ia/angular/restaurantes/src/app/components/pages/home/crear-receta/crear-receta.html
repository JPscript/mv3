<div class="main-wrapper">
	<div class="auth-container">
		<form class="form" (ngSubmit)="submitCreate()">
			<h1>Crear Receta</h1>

			<div class="input-group">
				<label for="nombre">Nombre de la receta</label>
				<input
					id="nombre"
					name="nombre"
					type="text"
					[(ngModel)]="nombre"
					placeholder="Nombre de la receta"
					required>
			</div>

			<div class="input-group">
				<label for="descripcion">Descripción</label>
				<textarea
					id="descripcion"
					name="descripcion"
					[(ngModel)]="descripcion"
					placeholder="Descripción de la receta"
					required></textarea>
			</div>

			<div class="input-group">
				<label for="ingredientes">Ingredientes</label>
				<textarea
					id="ingredientes"
					name="ingredientes"
					[(ngModel)]="ingredientes"
					placeholder="Ingredientes (separados por comas)"
					required></textarea>
			</div>

			<div class="input-row">
				<div class="input-group">
					<label for="tiempo_min">Tiempo (minutos)</label>
					<input
						id="tiempo_min"
						name="tiempo_min"
						type="number"
						[(ngModel)]="tiempo_min"
						min="0"
						required>
				</div>

				<div class="input-group">
					<label for="dificultad">Dificultad</label>
					<select
						id="dificultad"
						name="dificultad"
						[(ngModel)]="dificultad"
						required>
						<option value="Fácil">Fácil</option>
						<option value="Media">Media</option>
						<option value="Difícil">Difícil</option>
					</select>
				</div>
			</div>

			<div class="input-group">
				<label for="imagen">Imagen de la receta</label>
				<input
					id="imagen"
					name="imagen"
					type="file"
					accept="image/*"
					(change)="onFileSelected($event)">
				@if (previewUrl) {
					<div class="preview-container">
						<p>Previsualización:</p>
						<img [src]="previewUrl" alt="Previsualización" class="preview-image">
					</div>
				}
			</div>

			@if (errorMessage) {
				<p class="error-text">{{ errorMessage }}</p>
			}

			<button
				type="submit"
				class="btn-main"
				[disabled]="isSubmitting">
				@if (isSubmitting) {
					<span>Creando receta...</span>
				} @else {
					<span>Crear receta</span>
				}
				<span>→</span>
			</button>
		</form>

		<p><a routerLink="/restaurantes">← Volver</a></p>
	</div>
</div>
