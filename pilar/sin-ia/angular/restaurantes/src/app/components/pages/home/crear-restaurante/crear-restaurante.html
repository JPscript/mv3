<main>

    <div class="page">

        <h1>Añadir restaurante</h1>

        <p>
            Añade un nuevo restaurante a tu colección. Introduce los datos
            básicos para guardarlo en tu directorio.
        </p>

        <div id="contenedorForm">

            <form action="" method="post" class="create-form">

                <div class="campo">

                    <label for="nombre">Nombre del restaurante</label>

                    <input type="text" id="nombre" name="nombre" class="cajaTexto" placeholder="Nombre de tu receta"
                        required>

                </div>

                <div class="campo">

                    <label for="descripcion">Descripción</label>

                    <input type="text" id="descripcion" name="descripcion" class="cajaTexto"
                        placeholder="Breve descripción">

                </div>

                <div class="campo">

                    <label for="ubicacion">Ubicación</label>

                    <input type="text" id="ubicacion" name="ubicacion" class="cajaTexto"
                        placeholder="Dirección del restaurante">

                </div>

        
                <button type="submit" class="boton botonEnviar">
                    Guardar restaurante
                </button>

            </form>

        </div>

    </div>

</main>
