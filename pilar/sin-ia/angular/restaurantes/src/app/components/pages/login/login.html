<div class="main-wrapper">
  <div class="auth-container">
    
    <form class="login-form" (ngSubmit)="submitLogin()" #loginForm="ngForm">
      <h1>Inicia sesión</h1>

      <div class="input-group">
        <label for="nombre">Nombre</label>
        <input 
          id="nombre" 
          name="nombre" 
          type="text" 
          [(ngModel)]="nombre" 
          placeholder="Nombre de usuario" 
          required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          [(ngModel)]="password" 
          placeholder="Contraseña" 
          required>
        
        <div class="links-helper">
          <a href="#">¿Has olvidado tu contraseña?</a>
          <a routerLink="/registro" class="register-link">
            ¿No tienes cuenta? Regístrate
          </a>
        </div>
      </div>

      @if (errorMessage) {
        <p class="error-text" style="color: red; font-size: 0.9rem; margin-bottom: 1rem;">
          {{ errorMessage }}
        </p>
      }

      <button type="submit" class="btn-main" [disabled]="isSubmitting || !loginForm.valid">
        <span>
          @if (isSubmitting) { Entrando... } @else { CONTINUAR }
        </span>
        <span>→</span>
      </button>
    </form>

    <div class="separator">O también</div>

    <section class="social-auth">
      <div class="social-buttons">
        <button type="button" class="btn-social">CONTINUAR CON GOOGLE</button>
        <button type="button" class="btn-social">CONTINUAR CON APPLE</button>
      </div>
      <p class="legal">
        Al iniciar sesión, aceptas nuestra <strong>Política de Privacidad</strong>.
      </p>
    </section>

  </div>
</div>
