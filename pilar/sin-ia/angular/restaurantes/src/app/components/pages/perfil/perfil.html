<div class="profile-container">

  <!-- CABECERA -->
  <div class="profile-header">
    <img class="avatar" [src]="user.avatar" alt="Foto perfil">

    <div class="info">
      <h2>{{ user.name }}</h2>
      <p class="location">📍 {{ user.location }}</p>
      <p class="bio">{{ user.bio }}</p>

      <button>Seguir</button>
    </div>
  </div>

  <!-- INTERESES -->
  <div class="section">
    <h3>Intereses</h3>
    <div class="tags">
      @for (interest of user.interests; track interest) {
        <span >
          {{ interest }}
        </span>
      }
    </div>
  </div>

  <!-- VALORACIONES -->
  <div class="section">
    <h3>Valoraciones</h3>

    <div class="review">
      @for (review of user.reviews; track review) {
      <h4>{{ review.title }}</h4>
      <p class="stars">⭐ {{ review.rating }}/5</p>
      <p>{{ review.comment }}</p>
      }
    </div>

  </div>

</div>
