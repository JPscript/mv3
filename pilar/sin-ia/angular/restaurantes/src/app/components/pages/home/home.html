<div class="cards">
  @for (restaurante of restaurantesFake; track restaurante.id) {
    <app-restaurante-card
      [nombre]="restaurante.nombre"
      [descripcion]="restaurante.descripcion"
      [imagen]="restaurante.imagen"
      [ubicacion]="restaurante.ubicacion">
    </app-restaurante-card>
  }
</div>
