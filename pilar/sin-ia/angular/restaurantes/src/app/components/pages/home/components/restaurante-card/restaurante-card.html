<a [routerLink]="['/restaurantes/restaurante', id()]" class="card-link">
  <div class="restaurante-card">
    
    <div class="imagen">
      <img src="{{ imagen() }}" alt="{{ nombre() }}">
    </div>

    <div class="info-container">
      
      <div class="nombre">
        <h2>{{ nombre() }}</h2>
      </div>

      <div class="descripcion">
        <p> {{ descripcion() }}</p>
      </div>

      <div class="coordenadas">
       {{ lat() }}, {{ lng() }}
      </div>

      <button class="btn-ver-mas">Ver detalle</button>
    </div>

  </div>
</a>
