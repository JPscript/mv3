<div class="receta-container">
    
    <div class="receta-card">
        <img [src]="image_url()" alt="{{ nombre() }}" class="receta-img"/>

        <div class="receta-content">
            <h2>{{ nombre() }}</h2>

            <p class="descripcion">{{ descripcion() }}</p>

            <div class="receta-info">
                <div>
                    <h4>Ingredientes</h4>
                    <p>{{ ingredientes() }}</p>
                </div>

                <div class="meta">
                    <span>⏱ {{ tiempo_min() }} min</span>
                    <span>🔥 {{ dificultad() }}</span>
                </div>
            </div>
        </div>
    </div>

</div>
