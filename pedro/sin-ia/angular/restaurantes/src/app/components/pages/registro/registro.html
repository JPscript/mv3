<section class="login-simple">
	<form class="login-simple__card">
		<h1>Login</h1>

		<label for="correo">Correo</label>
		<input id="correo" type="email" name="correo" placeholder="correo@ejemplo.com" required />

		<label for="contrasena">Contrasena</label>
		<input id="contrasena" type="password" name="contrasena" placeholder="Introduce tu contrasena" required />

		<button type="submit">Entrar</button>
	</form>
</section>
