<section class="login-simple">
	<form class="login-simple__card" (ngSubmit)="submitLogin()">
		<h1>Login</h1>

		<label for="nombre">Nombre</label>
		<input id="nombre" type="text" name="nombre" [(ngModel)]="nombre" required />

		<label for="password">Contraseña</label>
		<input id="password" type="password" name="password" [(ngModel)]="password" required />

		@if (errorMessage) {
			<p>{{ errorMessage }}</p>
		}

		<button type="submit" [disabled]="isSubmitting">
			@if (isSubmitting) {
				Entrando...
			} @else {
				Iniciar sesión
			}
		</button>

		<p>¿Todavía no tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
	</form>
</section>
