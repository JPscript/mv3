<section>
	<h1>Actualizar restaurante</h1>

	@if (errorMessage) {
		<p class="error-message">{{ errorMessage }}</p>
	}

	<form (ngSubmit)="submitUpdate()">
		<label for="nombre">Nombre</label>
		<input id="nombre" name="nombre" [(ngModel)]="nombre" required>

		<label for="descripcion">Descripción</label>
		<textarea id="descripcion" name="descripcion" [(ngModel)]="descripcion" required></textarea>

		<label for="latitud">Latitud</label>
		<input id="latitud" name="latitud" type="number" step="0.000001" [(ngModel)]="latitud" required>

		<label for="longitud">Longitud</label>
		<input id="longitud" name="longitud" type="number" step="0.000001" [(ngModel)]="longitud" required>

		<button type="submit" [disabled]="isSubmitting">
			@if (isSubmitting) {
				Guardando cambios...
			} @else {
				Guardar cambios
			}
		</button>
	</form>

	<p><a class="back-link" routerLink="/restaurantes">Volver al listado</a></p>
</section>
