<header>
  <h1>TOP RESTAURANTS</h1>
  <p>La mejor guía sobre restaurantes</p>

  <nav class="header-nav" aria-label="Accesos principales">
    <a class="header-nav__item" routerLink="/restaurantes" aria-label="Ir a inicio">
      <span class="header-nav__icon">🏠</span>
      <span class="header-nav__label">Inicio</span>
    </a>
    <button
      type="button"
      class="header-nav__item"
      aria-label="Mostrar barra de buscador"
      (click)="toggleBarraBuscador()"
    >
      <span class="header-nav__icon">🔎</span>
      <span class="header-nav__label">Buscador</span>
    </button>

    @if (isLoggedIn()) {
      <a class="header-nav__item" routerLink="/perfil" aria-label="Ir a perfil">
        <span class="header-nav__icon">👤</span>
        <span class="header-nav__label">Perfil</span>
      </a>
      <button
        type="button"
        class="header-nav__item"
        aria-label="Cerrar sesión"
        (click)="logout()"
      >
        <span class="header-nav__icon">🚪</span>
        <span class="header-nav__label">Logout</span>
      </button>
    } @else {
      <a class="header-nav__item" routerLink="/login" aria-label="Ir a login">
        <span class="header-nav__icon">🔐</span>
        <span class="header-nav__label">Login</span>
      </a>
      <a class="header-nav__item" routerLink="/registro" aria-label="Ir a registro">
        <span class="header-nav__icon">📝</span>
        <span class="header-nav__label">Registro</span>
      </a>
    }

    <a class="header-nav__item" routerLink="/mapa" aria-label="Ir a mapas">
      <span class="header-nav__icon">🗺️</span>
      <span class="header-nav__label">Mapas</span>
    </a>
  </nav>

  @if (currentUser()) {
    <p>Sesión iniciada como {{ currentUser()?.nombre }}</p>
  }

  @if (mostrarBarraBuscador) {
    <form class="header-search" role="search" aria-label="Buscar restaurantes">
      <input
        class="header-search__input"
        type="search"
        name="busqueda"
        placeholder="Busca un restaurante..."
      />
      <button class="header-search__button" type="button" (click)="cerrarBarraBuscador()">
        Cerrar
      </button>
    </form>
  }
</header>
