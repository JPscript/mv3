  <div class="receta-card">
    <h2>{{ nombre() }}</h2>
    <p>Descripción: {{ descripcion() }}</p>
    <img [src]="imagen()" [alt]="nombre()">
    <p>Ingredientes: {{ ingredientes() }}</p>
    <p>Dificultad: {{ dificultad() }}</p>
    <p>Tiempo de preparación: {{ tiempo_min() }} minutos</p>
  </div>
