<!-- Container for all restaurant cards in a grid layout -->
<div class="cards-grid">
  <!-- Loop through each restaurant from the 'restaurants' array -->
  <!-- track: tells Angular how to identify each item (by id) for better performance -->
  @for (restaurant of restaurants; track restaurant.id) {
    <!-- Restaurant Card Component: displays each restaurant as a clickable card -->
    <!-- Properties passed via [...]: id, name, description, image, coordinates -->
    <app-restaurant-card
      [id]="restaurant.id"
      [name]="restaurant.nombre"
      [description]="restaurant.descripcion"
      [image]="restaurant.fotografia_url"
      [lat]="restaurant.latitud"
      [lng]="restaurant.longitud">
    </app-restaurant-card>
  }
</div>
