<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes CRUD - Home</title>
    <link rel="stylesheet" href="../shared/css/styles.css" />
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Recipes CRUD</h1>
            <p>Home page for C/R/U/D operations</p>
        </header>

        <section class="grid">
            <article class="card">
                <div class="card-body">
                    <h3>Create</h3>
                    <p>Create a new recipe and optionally upload an image.</p>
                    <div class="actions">
                        <a class="button-link" href="../Create/create.html">Go to Create</a>
                    </div>
                </div>
            </article>

            <article class="card">
                <div class="card-body">
                    <h3>Read</h3>
                    <p>List recipes and open details.</p>
                    <div class="actions">
                        <a class="button-link" href="../Read/read.html">Go to Read</a>
                    </div>
                </div>
            </article>

            <article class="card">
                <div class="card-body">
                    <h3>Update</h3>
                    <p>Select a recipe and edit its data.</p>
                    <div class="actions">
                        <a class="button-link" href="../Update/update.html">Go to Update</a>
                    </div>
                </div>
            </article>

            <article class="card">
                <div class="card-body">
                    <h3>Delete</h3>
                    <p>Delete a recipe with confirmation.</p>
                    <div class="actions">
                        <a class="button-link danger" href="../Delete/delete.html">Go to Delete</a>
                    </div>
                </div>
            </article>
        </section>
    </div>
</body>
</html>
