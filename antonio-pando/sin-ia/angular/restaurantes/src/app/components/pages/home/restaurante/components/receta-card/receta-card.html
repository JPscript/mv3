<div class="contenedorReceta">
  <h3>{{ nombre() }}</h3>
  <h4>Descripción</h4>
  <p>{{ descripcion() }}</p>
  <h4>Ingredientes</h4>
  <p>{{ ingredientes() }}</p>
  <h4>Tiempo</h4>
  <p>{{ tiempo_min() }} minutos</p>
  <h4>Dificultad</h4>
  <p>{{ dificultad() }}</p>
  <img src="{{ image_url() }}" alt="receta" />
</div>
